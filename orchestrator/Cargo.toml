[package]
name = "orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
aya = { version = "0.12", features = ["default", "tokio"] }
common = { path = "../common" }
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
log = "0.4"
env_logger = "0.10"
ctrlc = "3.2"
anyhow = "1.0"
